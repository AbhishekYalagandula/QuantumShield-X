<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumShield-X</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>🛡️ QuantumShield-X</h1>
        <p>AI Powered Post-Quantum Migration Assistant</p>
    </header>

    <main>

        <section class="upload-section">

            <h2>Upload Your Project</h2>

            <p>
                Upload your ZIP project to analyze quantum-vulnerable
                cryptographic algorithms.
            </p>

            <input type="file" id="projectFile" accept=".zip">

            <br><br>

            <button id="uploadBtn">
                Scan Project 🚀
            </button>

        </section>

        <section id="results">

            <h2>Results</h2>

            <p>
                Your analysis will appear here after scanning.
            </p>

        </section>

    </main>

<script src="js/app.js"></script>

</body>
</html>
